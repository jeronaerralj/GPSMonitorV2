<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .status-box { background: #333; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold;}
        .status-valid { color: #4caf50; border: 1px solid #4caf50; }
        .status-search { color: #ff9800; border: 1px solid #ff9800; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card h3 { margin: 0 0 10px 0; font-size: 0.9em; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 1.8em; font-weight: bold; }
        .unit { font-size: 0.5em; color: #888; }
        .footer { margin-top: 40px; text-align: center; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GPS Dashboard</h1>
        </div>
        
        <div id="status-box" class="status-box status-search">
            Status: <span id="status">Connecting...</span>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Latitude</h3>
                <div class="value"><span id="lat">---</span></div>
            </div>
            <div class="card">
                <h3>Longitude</h3>
                <div class="value"><span id="lon">---</span></div>
            </div>
            <div class="card">
                <h3>Speed</h3>
                <div class="value"><span id="speed">0.00</span> <span class="unit">km/h</span></div>
            </div>
            <div class="card">
                <h3>Altitude</h3>
                <div class="value"><span id="alt">0.0</span> <span class="unit">m</span></div>
            </div>
            <div class="card">
                <h3>Satellites</h3>
                <div class="value"><span id="sats">0</span></div>
            </div>
        </div>

        <div class="footer">
            Last Update (UTC): <span id="time">---</span>
        </div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('lat').innerText = data.latitude ? data.latitude.toFixed(6) : '---';
                    document.getElementById('lon').innerText = data.longitude ? data.longitude.toFixed(6) : '---';
                    document.getElementById('speed').innerText = data.speed_kmh.toFixed(2);
                    document.getElementById('alt').innerText = data.altitude;
                    document.getElementById('sats').innerText = data.satellites;
                    document.getElementById('time').innerText = data.timestamp || 'Waiting...';
                    
                    const statusBox = document.getElementById('status-box');
                    const statusText = document.getElementById('status');
                    
                    if (data.fix_quality > 0) {
                        statusText.innerText = "FIX ACQUIRED";
                        statusBox.className = "status-box status-valid";
                    } else {
                        statusText.innerText = "SEARCHING...";
                        statusBox.className = "status-box status-search";
                    }
                })
                .catch(err => console.error("Error fetching GPS data", err));
        }
        
        // Poll API every 1 second
        setInterval(updateDashboard, 1000);
        
        // Initial call
        updateDashboard();
    </script>
</body>
</html>
